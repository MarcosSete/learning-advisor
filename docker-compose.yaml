services:

  postgres:
    image: postgres:16
    container_name: learning-advisor-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: learning_advisor
      POSTGRES_USER: learning_advisor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U learning_advisor -d learning_advisor"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  qdrant:
    image: qdrant/qdrant:latest
    container_name: learning-advisor-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage


volumes:
  postgres_data:
  qdrant_data: