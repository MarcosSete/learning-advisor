[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "learning-advisor"
version = "0.1.0"
description = "AI-powered learning resource advisor"
requires-python = ">=3.13,<3.14"

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",

    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.0",

    "qdrant-client>=1.0",

    "httpx>=0.27",
    "feedparser>=6.0",

    "sentence-transformers>=3.0",
    "torch>=2.0",

    "deepagents",
    "langchain-deepseek",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 88
target-version = "py313"


[tool.setuptools.packages.find]
include = ["app*"]